[package]
name = "rust-backend-boilerplate"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.9"
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "schema-sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
