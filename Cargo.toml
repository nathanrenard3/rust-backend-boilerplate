[package]
name = "rust-backend-boilerplate"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["migration"]
resolver = "3"

[dependencies]
axum = "0.8.9"
axum-login = "0.18.0"
async-trait = "0.1"
email_address = "0.2"
password-auth = "1.0"
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
migration = { path = "migration" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "set-header"] }
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
thiserror = "2"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
